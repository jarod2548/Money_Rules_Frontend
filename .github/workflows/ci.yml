name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm run test


  e2e:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull backend image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/financial-app:latest

      - name: Start full stack
        run: docker compose -f docker-compose.e2e.yml up -d
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}


      - name: Run Cypress E2E tests
        run: docker compose -f docker-compose.e2e.yml run --rm e2e
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Tear down
        run: docker compose -f docker-compose.e2e.yml down

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/financial-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/financial-frontend:${{ github.sha }}